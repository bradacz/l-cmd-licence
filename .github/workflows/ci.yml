name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      LCMD_TEST_DB: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: lcmd_ci_test
      DB_USERNAME: root
      MAIL_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, openssl, pdo_mysql, sodium, dom, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Validate and install dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts
      - name: Start disposable database
        shell: bash
        run: |
          export MARIADB_ROOT_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$MARIADB_ROOT_PASSWORD"
          printf 'DB_PASSWORD=%s\n' "$MARIADB_ROOT_PASSWORD" >> "$GITHUB_ENV"
          docker run --detach --name lcmd-test-db \
            --publish 127.0.0.1:3306:3306 \
            --env MARIADB_ROOT_PASSWORD \
            --env MARIADB_ROOT_HOST=% \
            --env MARIADB_DATABASE=lcmd_ci_test \
            --health-cmd='healthcheck.sh --connect --innodb_initialized' \
            --health-interval=2s --health-timeout=5s --health-retries=30 \
            mariadb:11.8
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' lcmd-test-db)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          echo 'Disposable database did not become healthy.' >&2
          exit 1
      - name: PHP syntax
        run: composer lint
      - name: Unit and integration tests
        run: composer test
      - name: Remove disposable database
        if: always()
        run: docker rm --force --volumes lcmd-test-db || true
